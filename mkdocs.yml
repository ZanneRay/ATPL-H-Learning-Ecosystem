site_name: ATPL(H) Learning Ecosystem
site_description: Visual-first curriculum and learning-design handbook for ATPL(H), starting with Subject 082 Principles of Flight (Helicopters)
repo_url: https://github.com/ZanneRay/ATPL-H-Learning-Ecosystem
repo_name: ZanneRay/ATPL-H-Learning-Ecosystem

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/diagram-zoom.css

extra_javascript:
  - assets/javascripts/diagram-zoom.js

nav:
  - Home: index.md
  - Start Here:
      - Handbook Overview: curriculum-handbook/HANDBOOK-OUTLINE.md
      - Learning Ecosystem: architecture/LEARNING-ECOSYSTEM.md
      - Ecosystem Poster: architecture/ECOSYSTEM-POSTER.md
      - Student Learning Journey: architecture/STUDENT-LEARNING-JOURNEY.md
  - 082 Principles of Flight:
      - 32-hour Curriculum Map: curriculum/32-HOUR-CURRICULUM-MAP.md
      - EASA LO Mapping: curriculum/EASA-LO-MAPPING.md
      - Module 1 — Blueprint: curriculum/MODULE-1-BLUEPRINT.md
      - Module 1 — Complete Learning Experience: curriculum/MODULE-1-LEARNING-EXPERIENCE.md
      - Module 1 — Instructor Lesson Plan: curriculum/MODULE-1-INSTRUCTOR-LESSON-PLAN.md
      - Module 1 — Visual System: curriculum/MODULE-1-VISUAL-SYSTEM.md
  - Standards:
      - Documentation Standard: standards/DOCUMENTATION-STANDARD.md
      - BET Visual & Physics Contract: standards/BET-VISUAL-PHYSICS-CONTRACT.md

extra:
  generator: false

copyright: Working design handbook — ATPL(H) Learning Ecosystem
